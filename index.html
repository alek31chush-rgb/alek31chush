<!doctype html><html lang="ru"><head>  <meta charset="utf-8">  <meta name="viewport" content="width=device-width, initial-scale=1">  <meta name="theme-color" content="#10110f">  <meta name="description" content="Попробуйте вайбкодинг на практике: создайте первый сайт, посмотрите программу курса и получите 7 дней пробного доступа через канал MAX.">  <title>Вайбкодинг — попробуйте за 7 дней</title>  <style>    :root {      color-scheme: dark;      --ink: #f5f4ed;      --muted: #a7aaa0;      --base: #10110f;      --panel: #191b18;      --line: rgba(245, 244, 237, .12);      --lime: #d7ff63;      --lilac: #b6a2ff;      --coral: #ff886e;      --page: min(1160px, calc(100% - 48px));    }    * { box-sizing: border-box; }    html { scroll-behavior: smooth; scroll-padding-top: 88px; }    body {      margin: 0;      background: var(--base);      color: var(--ink);      font-family: Inter, "Segoe UI", Arial, sans-serif;      font-size: 16px;      line-height: 1.55;      -webkit-font-smoothing: antialiased;    }    a { color: inherit; }    button, a { -webkit-tap-highlight-color: transparent; }    button { font: inherit; }
